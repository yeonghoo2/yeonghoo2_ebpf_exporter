metrics:
  counters:
    - name: close_wait_sockets
      help: "Number of sockets in CLOSE_WAIT state"
      labels:
        - name: src_ip
          size: 4
          decoders:
            - name: inet_ip
        - name: dst_ip
          size: 4
          decoders:
            - name: inet_ip
        - name: src_port
          size: 2
          decoders:
            - name: uint
        - name: dst_port
          size: 2
          decoders:
            - name: uint
        - name: pid
          size: 4
          decoders:
            - name: uint
        - name: tgid
          size: 4
          decoders:
            - name: uint