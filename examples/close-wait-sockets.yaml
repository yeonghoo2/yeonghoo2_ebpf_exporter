metrics:
  counters:
    - name: close_wait_socket_count
      help: "Number of sockets in CLOSE_WAIT state"
      table: close_wait_sockets
      labels:
        - name: src_ip
          size: 4
          decoders:
            - name: inet_ip
        - name: dst_ip
          size: 4
          decoders:
            - name: inet_ip
        - name: src_port
          size: 2
          decoders:
            - name: uint
        - name: dst_port
          size: 2
          decoders:
            - name: uint
        - name: pid
          size: 4
          decoders:
            - name: uint
        - name: tgid
          size: 4
          decoders:
            - name: uint
        - name: uid
          size: 4
          decoders:
            - name: uint
        - name: comm
          size: 16
          decoders:
            - name: string
        - name: timestamp
          size: 8
          decoders:
            - name: uint
        - name: state
          size: 4
          decoders:
            - name: uint