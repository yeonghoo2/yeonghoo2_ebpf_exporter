# promql : topk(5, sum by (pid, hostname) (ebpf_exporter_close_wait_sock{pid!="0"}))

metrics:
  # 1. 프로세스별 카운터
  counters:
    - name: close_wait_proc
      help: "CLOSE_WAIT sockets by process and interface"
      labels:
        - name: pid_ifindex
          size: 8
          decoders:
            - name: uint

  # 2. 지속 시간 히스토그램 (30초 이상만)
  histograms:
    - name: close_wait_hist
      help: "Duration of TCP CLOSE_WAIT state (only for durations >= 30 seconds)"
      bucket_type: linear
      bucket_min: 6    # 30초 / 5초 = 6
      bucket_max: 60   # 300초 / 5초 = 60
      bucket_multiplier: 5  # 5초 단위로 버킷화
      labels:
        - name: bucket
          size: 4
          decoders:
            - name: uint

  # 3. 상세 추적 정보 (30초 이상 지속된 소켓들) - counters로 변경
  counters:
    - name: long_duration
      help: "Detailed information about long-duration CLOSE_WAIT sockets"
      labels:
        - name: src_ip
          size: 4
          decoders:
            - name: inet_ip
        - name: dst_ip
          size: 4
          decoders:
            - name: inet_ip
        - name: src_port
          size: 2
          decoders:
            - name: uint
        - name: dst_port
          size: 2
          decoders:
            - name: uint
        - name: pid
          size: 4
          decoders:
            - name: uint
        - name: tgid
          size: 4
          decoders:
            - name: uint
        - name: start_time
          size: 8
          decoders:
            - name: uint
        - name: state
          size: 4
          decoders:
            - name: uint
        - name: uid
          size: 4
          decoders:
            - name: uint
        - name: ifindex
          size: 4
          decoders:
            - name: uint
        - name: padding
          size: 8
          decoders:
            - name: uint

    # 4. 현재 추적 중인 모든 CLOSE_WAIT 소켓 정보 - counters로 변경
    - name: close_wait_sock
      help: "Currently tracked CLOSE_WAIT sockets with detailed information"
      labels:
        - name: pid
          size: 4
          decoders:
            - name: uint
        - name: src_port
          size: 4
          decoders:
            - name: uint
        - name: dst_port
          size: 4
          decoders:
            - name: uint
        - name: src_ip
          size: 4
          decoders:
            - name: inet_ip
        - name: dst_ip
          size: 4
          decoders:
            - name: inet_ip